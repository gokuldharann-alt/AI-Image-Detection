services:
  - type: web
    name: veritas-detector
    runtime: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install --no-cache-dir torch torchvision --index-url https://download.pytorch.org/whl/cpu && grep -v -E "^(torch|torchvision)" requirements.txt > /tmp/req.txt && pip install --no-cache-dir -r /tmp/req.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DEVICE
        value: cpu
      - key: USE_ONNX
        value: 0
      - key: USE_FP16
        value: 0
      - key: MODEL_BACKBONE
        value: efficientnet_b0
      - key: TORCH_WEIGHTS
        value: weights/hq_efficientnet_b0.pt
      - key: ONNX_WEIGHTS
        value: weights/hq_efficientnet_b0.onnx
      - key: IMAGE_SIZE
        value: 384
      - key: OMP_NUM_THREADS
        value: 1
      - key: OPENBLAS_NUM_THREADS
        value: 1
